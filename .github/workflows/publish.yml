name: Publish plugins

# Publishes every plugin under plugins/ whose package.json version differs from
# the version already on npm. Equal = skipped (green notice). Different = that
# one plugin gets typecheck + test + publish. Adding a 21st plugin needs no
# change here: drop the folder in, bump its version, push.
# Secret: NPM_TOKEN (automation type, so npm does not demand an OTP in CI).

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect unpublished plugin versions
        id: changes
        run: |
          node -e '
            const fs = require("fs");
            const cp = require("child_process");
            const dirs = fs.readdirSync("plugins").filter((d) =>
              fs.existsSync(`plugins/${d}/package.json`));
            const changed = [];
            for (const d of dirs) {
              const pkg = JSON.parse(fs.readFileSync(`plugins/${d}/package.json`, "utf8"));
              let published = "none";
              try {
                published = cp.execSync(`npm view ${pkg.name} version`,
                  { stdio: ["ignore", "pipe", "ignore"] }).toString().trim();
              } catch {}
              if (published === pkg.version) {
                console.log(`${pkg.name}@${pkg.version} already published - skipping`);
              } else {
                console.log(`${pkg.name}: ${published} -> ${pkg.version}`);
                changed.push(`plugins/${d}`);
              }
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${JSON.stringify(changed)}\n`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `| Plugin | Action |\n|---|---|\n` +
              (changed.length ? changed.map((c) => `| ${c} | publish |`).join("\n")
                              : "| - | nothing to publish |") + "\n");
          '

  publish:
    needs: detect
    if: needs.detect.outputs.changed != '[]' && needs.detect.outputs.changed != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.detect.outputs.changed) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install
        working-directory: ${{ matrix.plugin }}
        run: npm install
      - name: Typecheck
        working-directory: ${{ matrix.plugin }}
        run: npm run typecheck
      - name: Test
        working-directory: ${{ matrix.plugin }}
        run: npm test
      - name: Publish
        working-directory: ${{ matrix.plugin }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

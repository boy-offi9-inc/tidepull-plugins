name: Publish plugins

# Publishes every plugin under plugins/ whose package.json version changed.
# Gate: compare the local version against the published one on npm; equal =
# skip (green notice, no failure). Changed = typecheck + test, then publish.
# Same convention as the core Tidepull repo: secret NPM_TOKEN (an
# automation-type token, so npm does not demand an OTP in CI).

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect changed plugin versions
        id: changes
        run: |
          changed=""
          for dir in plugins/*/; do
            [ -f "$dir/package.json" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            local=$(node -p "require('./$dir/package.json').version")
            published=$(npm view "$name" version 2>/dev/null || echo none)
            if [ "$local" != "$published" ]; then
              echo "::notice::$name: $published -> $local"
              changed="$changed $dir"
            else
              echo "::notice::$name@$local already published - skipping"
            fi
          done
          echo "changed=$(echo $changed)" >> "$GITHUB_OUTPUT"

  publish:
    needs: detect
    if: needs.detect.outputs.changed != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: ${{ needs.detect.outputs.changed }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ${{ matrix.plugin }}/package-lock.json
      - name: Install
        working-directory: ${{ matrix.plugin }}
        run: npm install
      - name: Typecheck
        working-directory: ${{ matrix.plugin }}
        run: npm run typecheck
      - name: Test
        working-directory: ${{ matrix.plugin }}
        run: npm test
      - name: Publish
        working-directory: ${{ matrix.plugin }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
